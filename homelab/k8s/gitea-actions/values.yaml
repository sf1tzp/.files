# Gitea Actions Runner Helm chart values
# Default Values: https://gitea.com/gitea/helm-actions/src/branch/main/values.yaml
#
# Prerequisites:
#   1. Gitea must be running with actions.ENABLED = true
#   2. Create a runner registration token in Gitea:
#      Site Administration > Runners > Create new Runner
#   3. Create the k8s secret:
#      kubectl create secret generic runner-token \
#        --namespace gitea-actions \
#        --from-literal=token=<YOUR_TOKEN>

enabled: true

# --- Connection to Gitea ---
giteaRootURL: "http://gitea-http.gitea.svc.cluster.local:3000"

existingSecret: "runner-token"
existingSecretKey: "token"

# --- Runner StatefulSet ---
statefulset:
  replicas: 3
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: In
                values:
                  - "true"

  resources:
    requests:
      memory: 1Gi
      cpu: 1000m
    limits:
      memory: 3Gi
      cpu: 2000m

  persistence:
    enabled: true
    size: 50Gi

  # SSH keys for prod deploys; surfaced into job containers via DinD bind-mount.
  # The lab CA is baked into our custom DinD image (gitea.zen.lofi/sfi/dind),
  # so no daemon.json or per-registry configmap is needed here.
  extraVolumes:
    - name: runner-ssh
      secret:
        secretName: runner-ssh
        defaultMode: 0400

  # Chart 0.1.1 renamed this key from actRunner to runner (and rebranded the
  # image from act_runner to "runner" 1.x); values under the old key are
  # silently ignored and the chart falls back to its default config.
  runner:
    registry: docker.gitea.com
    repository: runner
    tag: "1.0.4"
    pullPolicy: IfNotPresent
    # cache: the runner's EMBEDDED cache server, persisted on the runner PVC
    # (/data). The runner advertises its URL to job containers and proxies
    # the modern actions/cache v2 protocol. Note the external falcondev
    # gha-cache server cannot be used from Gitea jobs: v9 dropped the v1
    # cache API, and the v2 protocol rides ACTIONS_RESULTS_URL, which the
    # gitea runner force-points at the gitea instance for artifact uploads.
    #
    # runner.labels override the registered labels: ubuntu-latest keeps the
    # upstream catthehacker image; ubuntu-deploy maps to our custom image
    # (sops/age/just/lab-CA + entrypoint that materializes ~/.ssh from the
    # runner-ssh volume).
    #
    # container.options binds /run/ssh-secrets from the DinD sidecar into every
    # job container; valid_volumes whitelists the path so the bind is permitted.
    config: |
      log:
        level: info
      cache:
        enabled: true
        dir: /data/actcache
      runner:
        labels:
          - "ubuntu-latest:docker://catthehacker/ubuntu:act-22.04"
          - "ubuntu-deploy:docker://gitea.zen.lofi/sfi/action-runner:14866ff"
      container:
        network: bridge
        docker_timeout: 300s
        options: --volume /run/ssh-secrets:/run/ssh-secrets:ro --add-host=host.docker.internal:host-gateway
        valid_volumes:
          - /run/ssh-secrets

  dind:
    registry: gitea.zen.lofi
    repository: sfi/dind
    tag: 14866ff
    pullPolicy: IfNotPresent
    extraVolumeMounts:
      - name: runner-ssh
        mountPath: /run/ssh-secrets
        readOnly: true


init:
  image:
    registry: docker.io
    repository: busybox
    tag: "1.37.0"
