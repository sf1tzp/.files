services:
  primetime-server:
    container_name: primetime-server
    # Builds the image from source so any clean host can `docker compose up
    # --build` without a Go toolchain. To run a published image instead,
    # override with `image:` (e.g. gitea.zen.lofi/sfi/primetime-server:v0.2.0).
    image: gitea.zen.lofi/sfi/primetime-server:0.6.1

    environment:
      # A default admin user is created only when the database is empty.
      # Change the password afterwards, or manage users with the admin CLI:
      #   docker compose exec primetime-server ./admin -h
      TRAGGO_DEFAULT_USER_NAME: admin
      TRAGGO_DEFAULT_USER_PASS: admin
      TRAGGO_DATABASE_DIALECT: sqlite3
      TRAGGO_DATABASE_CONNECTION: data/primetime.db
      TRAGGO_LOG_LEVEL: info
    ports:
      - "3030:3030"
    volumes:
      - primetime-data:/opt/primetime/data
    networks:
      - caddy_network
    restart: unless-stopped

volumes:
  primetime-data:

networks:
   caddy_network:
    driver: bridge
