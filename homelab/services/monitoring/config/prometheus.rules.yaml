groups:
  - name: symbology.online
    rules:
      - alert: https_status
        expr: probe_success{job="https_from_soundship", instance="https://symbology.online"} == 0
        for: 5m

  - name: moment-tally.com
    rules:
      - alert: https_status
        expr: probe_success{job="https_from_soundship", instance=~"https://moment-tally.com"} == 0
        for: 5m

  - name: streetfortress.com
    rules:
      - alert: https_status
        expr: probe_success{job="https_from_soundship", instance=~"https://streetfortress.com"} == 0
        for: 5m
