---
# soundship's storage drive, captured (estate-hub#93): the exFAT mount,
# the Samba share the Macs offload video to, and the nightly restic
# backup of the drive to Backblaze B2.
#
# Secrets come from ~/.homelab-storage-secrets.yaml on the controller,
# ansible-vault encrypted — README.md documents its shape and the two
# manual mint steps (the Samba password, the B2 application key).
#
# Run with: just storage
- name: Soundship storage drive
  hosts: soundship
  become: true
  vars_files:
    - "{{ lookup('env', 'HOME') }}/.homelab-storage-secrets.yaml"

  handlers:
    - name: Restart smbd
      ansible.builtin.systemd:
        name: smbd
        state: restarted

  tasks:
    - name: Install samba and restic
      ansible.builtin.apt:
        name:
          - samba
          - restic
        state: present
        update_cache: true

    # The drive is exFAT until the repave reformats it (#93 decides the
    # filesystem then). exFAT has no owners, so the mount assigns
    # everything to nobody:nogroup; the share's `force user` below
    # depends on these exact options.
    - name: Mount the storage drive
      ansible.posix.mount:
        path: /mnt/storage
        src: UUID=670D-7EB0
        fstype: exfat
        opts: defaults,uid=nobody,gid=nogroup,umask=0002,nofail
        state: mounted

    - name: Write smb.conf
      ansible.builtin.template:
        src: templates/smb.conf.j2
        dest: /etc/samba/smb.conf
        owner: root
        group: root
        mode: "0644"
        backup: true
      notify: Restart smbd

    # The playbook never writes the Samba password (it must not live in
    # a command line or the vault twice); a human runs `sudo smbpasswd
    # -a steven` once on the host. Fail loudly until that happened.
    - name: Check the Samba account for steven exists
      ansible.builtin.command: pdbedit -u steven
      register: smb_account
      changed_when: false
      failed_when: false

    - name: Fail when the Samba account is missing
      ansible.builtin.fail:
        msg: >-
          No Samba account for steven. Run `sudo smbpasswd -a steven` on
          soundship, then re-run this playbook. The share is
          authenticated-only: macOS Tahoe requires signed SMB sessions,
          and a guest session has no key to sign with (estate-hub#93).
      when: smb_account.rc != 0

    - name: Enable smbd
      ansible.builtin.systemd:
        name: smbd
        state: started
        enabled: true

    # --- restic → B2 ---

    - name: Create /etc/restic
      ansible.builtin.file:
        path: /etc/restic
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Write the restic repository password
      ansible.builtin.copy:
        content: "{{ storage_restic_password }}\n"
        dest: /etc/restic/storage.pass
        owner: root
        group: root
        mode: "0600"

    - name: Write the restic B2 environment
      ansible.builtin.template:
        src: templates/restic-b2.env.j2
        dest: /etc/restic/storage-b2.env
        owner: root
        group: root
        mode: "0600"

    - name: Install the backup freshness metrics script
      ansible.builtin.copy:
        src: files/restic-storage-metrics.sh
        dest: /usr/local/bin/restic-storage-metrics
        owner: root
        group: root
        mode: "0755"

    - name: Install the backup service and timer
      ansible.builtin.template:
        src: "templates/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - restic-backup-storage.service
        - restic-backup-storage.timer
      register: backup_units

    - name: Initialize the restic repository when it does not exist
      ansible.builtin.shell: |
        set -euo pipefail
        set -a; . /etc/restic/storage-b2.env; set +a
        if ! restic cat config >/dev/null 2>&1; then
          restic init
          echo INITIALIZED
        fi
      args:
        executable: /bin/bash
      register: restic_init
      changed_when: "'INITIALIZED' in restic_init.stdout"

    - name: Enable the backup timer
      ansible.builtin.systemd:
        name: restic-backup-storage.timer
        state: started
        enabled: true
        daemon_reload: "{{ backup_units.changed }}"
