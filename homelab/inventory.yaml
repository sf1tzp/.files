    wireguard:
      children:
        devbox: {}
        staging-web: {}
        staging-db: {}
        hypervisor: {}
        db2-streetfortress-cloud: {}
        web2-streetfortress-cloud: {}

    staging:
      children:
        staging-1g: {}
        staging-v2: {}

    # NixOS VMs: created via `just create-nixos` from flake-built images.
    # Deliberately NOT in `vms`/`containerd`/`monitoring` — those apply
    # apt-based setup. These hosts are configured declaratively in nixos/.
    # ansible_host MUST match the static IP baked into the host's nixos config
    # (hosts/<name>/default.nix).
    nixos:
      hosts:
        staging-k3s:
          ansible_host: 10.0.0.40
          vcpus: 4
          memory: 8
          disk_size: "40G"
          # On the WireGuard mesh: create-nixos.yaml keys off wg_vpn_ip to
          # generate the wg key, register the peer, and bake
          # wireguard-private-key into secrets/staging-k3s.yaml.
          wg_vpn_ip: 10.1.0.13
          wg_endpoint_ip: 10.0.0.40
        luxor:
          ansible_host: 10.0.0.5
          vcpus: 4
          memory: 8
          disk_size: "40G"
          wg_vpn_ip: 10.1.0.5
          wg_endpoint_ip: 10.0.0.5
