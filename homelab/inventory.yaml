---
all:
  children:
    hypervisor:
      hosts:
        soundship:
          ansible_host: 10.0.0.2
          wg_vpn_ip: 10.1.0.1
          logging_endpoint_ip: 10.0.0.2 # Self-hosted logging
          # Mesh→LAN inference forward (symbology#166, deployments#79): LM
          # Studio serves LLM + embeddings on 11434 from the win11 VM, which
          # is LAN-only and deliberately NOT a mesh peer (personal machine
          # stays outside the production trust boundary). Mesh peers reach it
          # at 10.1.0.1:11434. Local inference is best-effort by policy —
          # workers fall back to outsourced LLM calls (symbology#146). Flip
          # dest to 10.0.0.4 when llm-server runs instead of win11, then
          # `just wireguard soundship`.
          wg_forwards:
            - port: 11434
              dest: 10.0.0.99
              oif: br0

    vms:
      children:
        devbox:
          hosts:
            devbox:
              ansible_host: 10.0.0.3
              os: "ubuntu-server-24.04"
              vcpus: 8
              memory: 24
              disk_size: "150G"
              gpu_passthrough: false
              wg_vpn_ip: 10.1.0.3
              logging_endpoint_ip: 10.0.0.2

        llm-server:
          hosts:
            llm-server:
              ansible_host: 10.0.0.4
              os: "ubuntu-server-24.04"
              vcpus: 4
              memory: 8
              disk_size: "150G"
              gpu_passthrough: true
              gpu_domain: "0x0000"
              gpu_bus: "0x01"
              gpu_slot: "0x00"
              logging_endpoint_ip: 10.0.0.2

        custom-image-builder:
          hosts:
            custom-image-builder:
              ansible_host: 10.0.0.7
              os: "ubuntu-server-24.04"
              vcpus: 4
              memory: 8
              gpu_passthrough: false
              disk_size: "25G"

        image-test:
