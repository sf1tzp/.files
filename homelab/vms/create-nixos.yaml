---
# Create NixOS VMs on the libvirt host from flake-built qcow2 images — ONE-SHOT.
#
# This is the pre-seed flow: instead of booting first and then deriving the
# VM's sops identity from its freshly-generated SSH host key (the old
# derive-then-redeploy dance), we generate the host identity UP FRONT, encrypt
# the per-host secrets to it, bake them into the image, and inject the matching
# private host key into the qcow2 before boot. The VM comes up already able to
# decrypt its k3s-token / wireguard-private-key, joins the mesh, and starts k3s
# on first boot. No second deploy.
#
# Per targeted host, before the domain is defined:
#   1. Generate an ed25519 SSH host key (once; persisted OUT OF GIT on soundship
#      under ~/.local/share/nixos-provisioning/<host>/, reused on re-runs).
#   2. Derive its age recipient (ssh-to-age) and add a per-host rule to
#      nixos/.sops.yaml (encrypt to devbox + zenbook + this VM).
#   3. Generate k3s-token (+ wireguard-private-key when the host has a
#      wg_vpn_ip) and write the encrypted nixos/secrets/<host>.yaml.
#   4. When wireguard is in play, add the peer (public key + IPs) to
#      homelab/wireguard/peers.json.
#   5. `git add` the three git-tracked files so the flake build sees them
#      (Nix only reads tracked/staged files) — but do NOT commit; that's yours.
#   6. Build the qcow2, inject the private host key with guestfish, then
#      define + start.
#
# The only thing that lives out-of-band is the VM's private host key (in the
# provisioning dir). Everything else stays in git, encrypted and declarative.
#
# ── NIX-SIDE PREREQUISITE (per new host, done once by you) ────────────────────
# The generated secret only helps if the host's module actually points at it and
# decrypts with the injected host key. In nixos/hosts/<host>/default.nix:
#     sops.defaultSopsFile   = ../secrets/<host>.yaml;
#     sops.age.sshKeyPaths    = [ "/etc/ssh/ssh_host_ed25519_key" ];
#     sops.age.keyFile        = lib.mkForce null;   # override modules/secrets.nix
# and import modules/wireguard.nix (parametrised for this host) if it joins the
# mesh. Add the host to homelab/inventory.yaml under `nixos:` with ansible_host
# (matching the static IP baked into its config) and, for mesh hosts, wg_vpn_ip
# (+ optional wg_endpoint_ip).
#
# Run on the hypervisor (localhost == soundship):
#   just create-nixos staging-k3s
- name: Create NixOS Virtual Machines (pre-seeded, one-shot)
  hosts: localhost
  vars:
    libvirt_images: /var/lib/libvirt/images
    nixos_flake: "{{ lookup('env', 'HOME') }}/.files/nixos"
    repo_root: "{{ lookup('env', 'HOME') }}/.files"
    sops_config: "{{ lookup('env', 'HOME') }}/.files/nixos/.sops.yaml"
    secrets_dir: "{{ lookup('env', 'HOME') }}/.files/nixos/secrets"
    peers_file: "{{ lookup('env', 'HOME') }}/.files/homelab/wireguard/peers.json"

    # Private host keys (and wg private keys) live here, never in git. Losing
    # this dir means regenerate + reprovision — fine for staging.
    provisioning_dir: "{{ lookup('env', 'HOME') }}/.local/share/nixos-provisioning"

    # Admin recipients every per-host secret is ALSO encrypted to, so the
    # cluster operators can read/rotate. These are the devbox + zenbook keys
    # already in nixos/.sops.yaml.
    admin_age_recipients:
      - age1rgr7hqdjsu4y3m98z3yw7cfwf9w8q4xdvmrv4jc97na32svm5y2qtpsw9x  # devbox
      - age1qg7umu2tev8057x4qte4g8smua7nqhdhqmrk49pq9xpx6zxc0p3qjurnlh  # zenbook

    # ssh-to-age / guestfish aren't on PATH; run them from nixpkgs. We inject the
    # host key with guestfish (not virt-customize): libguestfs OS-inspection
    # can't identify a NixOS guest (store-symlinked /etc), so virt-customize
    # aborts with "no operating systems were found". guestfish sidesteps
    # inspection by mounting the root partition explicitly. guestfish lives in
    # libguestfs, and needs the bundled appliance (libguestfs-with-appliance).
    ssh_to_age_cmd: "nix shell nixpkgs#ssh-to-age -c ssh-to-age"
    guestfish_cmd: "nix shell nixpkgs#libguestfs-with-appliance -c guestfish"
    # nixos-generators qcow layout: /dev/sda1 ESP, sda2 BIOS-boot, sda3 root
    # (ext4, label `nixos`). Verify with: virt-filesystems -a <img> --all --long
    nixos_root_dev: /dev/sda3

    default_vm_spec:
      vcpus: 2
      memory: 4
      disk_size: 40G

  tasks:
    - name: Parse target VMs from command line
      set_fact:
        target_vm_list: "{{ target_vms.split() if target_vms is defined else [] }}"

    - name: Build VM specs from inventory
      set_fact:
        vm_specs: >-
          {{
            vm_specs | default([]) + [{
              'hostname': item,
              'ip': hostvars[item]['ansible_host'],
              'vcpus': hostvars[item]['vcpus'] | default(default_vm_spec.vcpus),
              'memory': hostvars[item]['memory'] | default(default_vm_spec.memory),
              'disk_size': hostvars[item]['disk_size'] | default(default_vm_spec.disk_size),
              'flake_attr': hostvars[item]['nixos_flake_attr'] | default(item + '-qcow'),
              'wg_vpn_ip': hostvars[item]['wg_vpn_ip'] | default(omit),
              'wg_endpoint_ip': hostvars[item]['wg_endpoint_ip'] | default(omit)
            }]
          }}
      loop: "{{ groups['nixos'] }}"
      loop_control:
        label: "Building spec for {{ item }}"
      when: target_vm_list | length == 0 or item in target_vm_list

    - name: Display final VM specifications
      debug:
        msg: >-
          NixOS VM {{ item.hostname }}: {{ item.vcpus }}vCPU, {{ item.memory }}GB RAM,
          {{ item.disk_size }} disk, IP: {{ item.ip }}, attr: {{ item.flake_attr }}{{
          ', wg: ' + item.wg_vpn_ip if item.wg_vpn_ip is defined else ' (no wireguard)' }}
      loop: "{{ vm_specs }}"
      loop_control:
        label: "{{ item.hostname }}"

    # ── Phase A: pre-seed identity, secrets, sops rules, peers ────────────────
    # Runs for ALL targeted hosts (idempotent), so you can repair/re-derive a
    # host's provisioning state without recreating the domain.

    - name: Ensure per-host provisioning directory exists (out of git)
      file:
        path: "{{ provisioning_dir }}/{{ item.hostname }}"
        state: directory
        mode: "0700"
      with_items: "{{ vm_specs }}"
      loop_control:
        label: "{{ provisioning_dir }}/{{ item.hostname }}"

    - name: Generate the VM's ed25519 SSH host key (once; reused on re-runs)
      command:
        cmd: >-
          ssh-keygen -t ed25519 -N "" -C "{{ item.hostname }}"
          -f "{{ provisioning_dir }}/{{ item.hostname }}/ssh_host_ed25519_key"
        creates: "{{ provisioning_dir }}/{{ item.hostname }}/ssh_host_ed25519_key"
      with_items: "{{ vm_specs }}"
      loop_control:
        label: "Host key for {{ item.hostname }}"

    - name: Derive the sops age recipient from the host public key
      shell: >-
        {{ ssh_to_age_cmd }} -i
        "{{ provisioning_dir }}/{{ item.hostname }}/ssh_host_ed25519_key.pub"
      register: age_derive
      changed_when: false
      with_items: "{{ vm_specs }}"
      loop_control:
        label: "age recipient for {{ item.hostname }}"

    - name: Generate the wireguard private key for mesh hosts (once)
      shell: |
        set -euo pipefail
        umask 077
        wg genkey > "{{ provisioning_dir }}/{{ item.hostname }}/wireguard-private-key"
      args:
        creates: "{{ provisioning_dir }}/{{ item.hostname }}/wireguard-private-key"
        executable: /bin/bash
      when: item.wg_vpn_ip is defined
      with_items: "{{ vm_specs }}"
      loop_control:
        label: "wg key for {{ item.hostname }}"

    - name: Derive the wireguard public key for mesh hosts
      shell: >-
        wg pubkey < "{{ provisioning_dir }}/{{ item.hostname }}/wireguard-private-key"
      register: wg_derive
      changed_when: false
      when: item.wg_vpn_ip is defined
      with_items: "{{ vm_specs }}"
      loop_control:
        label: "wg pubkey for {{ item.hostname }}"

    - name: Index derived identities by hostname
      set_fact:
        age_recipient_by_host: >-
          {{ dict(age_derive.results | map(attribute='item.hostname') | list
             | zip(age_derive.results | map(attribute='stdout') | map('trim') | list)) }}
        wg_pubkey_by_host: >-
          {{ dict(wg_derive.results | rejectattr('skipped', 'defined')
             | map(attribute='item.hostname') | list
             | zip(wg_derive.results | rejectattr('skipped', 'defined')
             | map(attribute='stdout') | map('trim') | list)) }}

    - name: Add a per-host creation rule to nixos/.sops.yaml
      # Inserted ABOVE the catch-all `secrets/.*\.yaml$` rule so sops
      # (first-match-wins) encrypts secrets/<host>.yaml to exactly
      # devbox + zenbook + this VM. Idempotent via the per-host marker.
      blockinfile:
        path: "{{ sops_config }}"
        insertbefore: '^  - path_regex: secrets/\.\*\\\.yaml\$'
        marker: "  # {mark} ANSIBLE sops rule: {{ item.hostname }}"
        block: |2
            - path_regex: secrets/{{ item.hostname }}\.yaml$
              age:
          {% for r in admin_age_recipients %}
                - {{ r }}
          {% endfor %}
                - {{ age_recipient_by_host[item.hostname] }}
      with_items: "{{ vm_specs }}"
      loop_control:
        label: "sops rule for {{ item.hostname }}"

    - name: Create the encrypted per-host secret (only if absent)
      # k3s-token always; wireguard-private-key when the host joins the mesh.
      # Written in the clear then encrypted in place — the .sops.yaml rule added
      # above decides the recipients. `creates` makes this a no-op on re-runs.
      # NB: --config is required — sops searches for .sops.yaml from the CWD, not
      # from the file's directory, so without it the creation rules aren't found
      # and encryption fails (leaving the token in plaintext).
      shell: |
        set -euo pipefail
        umask 077
        f="{{ secrets_dir }}/{{ item.hostname }}.yaml"
        {
          echo "k3s-token: $(openssl rand -hex 32)"
        {% if item.wg_vpn_ip is defined %}
          echo "wireguard-private-key: $(cat {{ provisioning_dir }}/{{ item.hostname }}/wireguard-private-key)"
        {% endif %}
        } > "$f"
        sops --config "{{ sops_config }}" -e -i "$f"
      args:
        creates: "{{ secrets_dir }}/{{ item.hostname }}.yaml"
        executable: /bin/bash
      with_items: "{{ vm_specs }}"
      loop_control:
        label: "secret for {{ item.hostname }}"

    - name: Read current wireguard peers
      slurp:
        src: "{{ peers_file }}"
      register: peers_slurp

    - name: Add the VM as a wireguard peer (idempotent; mesh hosts only)
      # jq preserves existing key order and only appends the new peer.
      shell: |
        set -euo pipefail
        jq --arg name "{{ item.hostname }}" \
           --arg ip "{{ item.wg_vpn_ip }}" \
           --arg pub "{{ wg_pubkey_by_host[item.hostname] }}" \
        {% if item.wg_endpoint_ip is defined %}
           --arg ep "{{ item.wg_endpoint_ip }}" \
           '.peers[$name] = {wg_vpn_ip: $ip, wg_endpoint_ip: $ep, public_key: $pub}' \
        {% else %}
           '.peers[$name] = {wg_vpn_ip: $ip, public_key: $pub}' \
        {% endif %}
           "{{ peers_file }}" > "{{ peers_file }}.tmp"
        mv "{{ peers_file }}.tmp" "{{ peers_file }}"
      args:
        executable: /bin/bash
      when:
        - item.wg_vpn_ip is defined
        - item.hostname not in (peers_slurp.content | b64decode | from_json).peers
      with_items: "{{ vm_specs }}"
      loop_control:
        label: "peer for {{ item.hostname }}"

    - name: Stage generated files so the flake build can see them
      # Nix flakes only read git-tracked/staged files — untracked secrets are
      # silently ignored. Stage (don't commit); you review + commit yourself.
      command:
        cmd: >-
          git add --
          nixos/.sops.yaml
          homelab/wireguard/peers.json
          {{ vm_specs | map(attribute='hostname') | map('regex_replace', '^(.*)$', 'nixos/secrets/\1.yaml') | join(' ') }}
        chdir: "{{ repo_root }}"
      changed_when: false

    # ── Phase B: build, inject identity, define + start ───────────────────────
    - name: Checking if VMs exist
      virt:
        name: "{{ item.hostname }}"
        command: status
      register: vm_status
      failed_when: false
      with_items: "{{ vm_specs }}"
      loop_control:
        label: "Checking if {{ item.hostname }} is already defined"

    - set_fact:
        vms_to_create: "{{ vm_specs | selectattr('hostname', 'in', vm_status.results | selectattr('status', 'undefined') | map(attribute='item.hostname') | list) }}"

    - name: Report plan
      debug:
        msg: >-
          create: {{ vms_to_create | map(attribute='hostname') | join(', ') | default('(none)', true) }};
          already defined: {{ vm_specs | map(attribute='hostname') | difference(vms_to_create | map(attribute='hostname')) | join(', ') | default('(none)', true) }}

    - name: Build NixOS qcow2 images
      shell: >
        nix build "{{ nixos_flake }}#{{ item.flake_attr }}"
        --no-link --print-out-paths
      register: nix_build
      changed_when: true
      with_items: "{{ vms_to_create }}"
      loop_control:
        label: "Built {{ item.flake_attr }}"

    - name: Copy built image into the libvirt images dir
      copy:
        src: "{{ item.stdout_lines | last | trim }}/nixos.qcow2"
        dest: "{{ libvirt_images }}/{{ item.item.hostname }}.qcow2"
        mode: "0644"
        remote_src: true
      with_items: "{{ nix_build.results }}"
      loop_control:
        label: "Copied image for {{ item.item.hostname }}"

    - name: Grow the OS disk to the requested size
      # The qcow format ships a small, growable root (autoResize) that expands
      # to fill the disk on first boot.
      shell: qemu-img resize "{{ libvirt_images }}/{{ item.item.hostname }}.qcow2" "{{ item.item.disk_size }}"
      with_items: "{{ nix_build.results }}"
      loop_control:
        label: "Resized {{ item.item.hostname }} disk to {{ item.item.disk_size }}"

    - name: Inject the pre-generated SSH host key into the image
      # This is what makes the VM decrypt its sops secrets on first boot: the
      # host key whose age recipient the secret was encrypted to is written into
      # /etc/ssh before the domain ever starts. We mount the root partition
      # explicitly (guestfish, no inspection) and upload the key pair, since
      # virt-customize can't inspect a NixOS guest. LIBGUESTFS_BACKEND=direct
      # runs the appliance under our own KVM access rather than via libvirt.
      # chown uses numeric root uid/gid (0 0) — guestfish takes no names.
      shell: |
        set -euo pipefail
        {{ guestfish_cmd }} --rw -a "{{ libvirt_images }}/{{ item.item.hostname }}.qcow2" <<'GFS'
        run
        mount {{ nixos_root_dev }} /
        upload {{ provisioning_dir }}/{{ item.item.hostname }}/ssh_host_ed25519_key /etc/ssh/ssh_host_ed25519_key
        upload {{ provisioning_dir }}/{{ item.item.hostname }}/ssh_host_ed25519_key.pub /etc/ssh/ssh_host_ed25519_key.pub
        chmod 0600 /etc/ssh/ssh_host_ed25519_key
        chmod 0644 /etc/ssh/ssh_host_ed25519_key.pub
        chown 0 0 /etc/ssh/ssh_host_ed25519_key
        chown 0 0 /etc/ssh/ssh_host_ed25519_key.pub
        GFS
      args:
        executable: /bin/bash
      environment:
        LIBGUESTFS_BACKEND: direct
      with_items: "{{ nix_build.results }}"
      loop_control:
        label: "Injected host key into {{ item.item.hostname }}"

    - name: Define virtual machines
      virt:
        name: "{{ item.hostname }}"
        command: define
        xml: "{{ lookup('template', 'templates/nixos-definition.xml.j2') }}"
      with_items: "{{ vms_to_create }}"
      loop_control:
        label: "Defined {{ item.hostname }} libvirt domain"

    - name: Start virtual machines
      virt:
        name: "{{ item.hostname }}"
        state: running
      with_items: "{{ vms_to_create }}"
      loop_control:
        label: "Started {{ item.hostname }}"

    - name: Next steps
      debug:
        msg: >-
          {{ vms_to_create | map(attribute='hostname') | join(', ') | default('(none)', true) }}
          created and started — each boots with its host key already in place and
          should decrypt its secrets, join the mesh (if configured), and start k3s
          on first boot. NO second deploy needed. Review the staged changes
          (git diff --cached in ~/.files: nixos/.sops.yaml, nixos/secrets/*.yaml,
          homelab/wireguard/peers.json) and commit. Ensure each host's
          nixos/hosts/<host>/default.nix sets sops.defaultSopsFile +
          sops.age.sshKeyPaths = ["/etc/ssh/ssh_host_ed25519_key"] (see header).
