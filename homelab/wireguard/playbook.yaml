---
- name: Install and configure Wireguard on homelab hosts
  hosts: wireguard
  become: yes
  serial: 1  # serialize to avoid concurrent peers.json mutations
  vars:
    peers_file: "{{ playbook_dir }}/peers.json"
    wg_key_file: /etc/wireguard/wg0.key
    wg_port: 51820
  tasks:
    - name: Install Wireguard packages
      ansible.builtin.package:
        name:
          - wireguard-tools
          - wireguard
        state: present

    - name: Create Wireguard configuration directory
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        mode: "0700"

    # --- Private key management ---
    # The key lives on the host, in /etc/wireguard/wg0.key, and nowhere else.
    # (The vault-encrypted ~/.homelab-wireguard-keys.yaml practice is retired:
    # every host it held besides soundship is decommissioned, and the control
    # machine never needed a copy — the host is the key's trust boundary.)
    # No task reads the key into a variable; the template points wg-quick at
    # the file instead of embedding the key in the rendered config.
    - name: Check for the key file
      ansible.builtin.stat:
        path: "{{ wg_key_file }}"
      register: wg_key

    - name: Check for a rendered wg0.conf to migrate the key out of
      ansible.builtin.stat:
        path: /etc/wireguard/wg0.conf
      register: wg_conf

    - name: Migrate the private key out of an existing wg0.conf
      ansible.builtin.shell:
        cmd: umask 077 && awk '/^PrivateKey/ {print $3}' /etc/wireguard/wg0.conf > {{ wg_key_file }}
      args:
        creates: "{{ wg_key_file }}"
      no_log: true
      when: not wg_key.stat.exists and wg_conf.stat.exists

    - name: Generate a private key on a fresh host
      ansible.builtin.shell:
        cmd: umask 077 && wg genkey > {{ wg_key_file }}
      args:
        creates: "{{ wg_key_file }}"
      no_log: true
      when: not wg_key.stat.exists and not wg_conf.stat.exists

    # Fails loudly on an empty or malformed key file (e.g. a wg0.conf that
    # had no PrivateKey line to migrate). The derived pubkey is not secret.
    - name: Derive the public key from the key file
      ansible.builtin.shell:
        cmd: wg pubkey < {{ wg_key_file }}
      register: wg_public_key
      changed_when: false

    # --- peers.json is the source of truth for all peer metadata ---
    - name: Read peers.json
      ansible.builtin.include_vars:
        file: "{{ peers_file }}"
        name: peers_data

    - name: Fail if this host is missing from peers.json
      ansible.builtin.fail:
        msg: "{{ inventory_hostname }} is not listed under peers in {{ peers_file }}"
      when: inventory_hostname not in peers_data.peers

    - name: Read committed pubkey for this host
      ansible.builtin.set_fact:
        committed_pubkey: "{{ peers_data.peers[inventory_hostname].public_key | default('') }}"

    - name: Write this host's pubkey into peers.json if empty
      ansible.builtin.command:
        cmd: >-
          jq --arg k "{{ wg_public_key.stdout }}"
             '.peers["{{ inventory_hostname }}"].public_key = $k'
             {{ peers_file }}
      register: peers_json_patched
      changed_when: true
      when: committed_pubkey == ""
      delegate_to: localhost
      become: no

    - name: Persist patched peers.json
      ansible.builtin.copy:
        content: "{{ peers_json_patched.stdout }}\n"
        dest: "{{ peers_file }}"
        mode: "0644"
      when: committed_pubkey == ""
      delegate_to: localhost
      become: no

    - name: Re-read peers.json after pubkey write
      ansible.builtin.include_vars:
        file: "{{ peers_file }}"
        name: peers_data
      when: committed_pubkey == ""

    - name: Fail if committed pubkey does not match this host's key
      ansible.builtin.fail:
        msg: >-
          peers.json has public_key '{{ committed_pubkey }}' for {{ inventory_hostname }},
          but {{ wg_key_file }} derives to '{{ wg_public_key.stdout }}'.
          Someone regenerated a key. Reconcile manually.
      when:
        - committed_pubkey != ""
        - committed_pubkey != wg_public_key.stdout

    # --- Render and deploy wg0.conf ---
    - name: Render wg0.conf
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/wg0.conf.j2"
        dest: /etc/wireguard/wg0.conf
        mode: "0600"
      notify: restart wireguard

    - name: Enable and start Wireguard
      ansible.builtin.service:
        name: wg-quick@wg0
        enabled: yes
        state: started

    # Split-DNS: route *.lofi queries over the tunnel to soundship's dnsmasq.
    # Only needed on hosts that can't reach soundship on the LAN directly —
    # the streetfortress.cloud VMs. (No such hosts remain; kept for the
    # archaeology, removed whenever the inventory cleanup lands.)
    - name: Ensure systemd-resolved drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"
      when: "'streetfortress-cloud' in inventory_hostname"

    - name: Install homelab resolved.conf drop-in
      ansible.builtin.template:
        src: "{{ playbook_dir }}/templates/homelab-resolved.conf.j2"
        dest: /etc/systemd/resolved.conf.d/homelab.conf
        mode: "0644"
      notify: restart systemd-resolved
      when: "'streetfortress-cloud' in inventory_hostname"

  handlers:
    - name: restart wireguard
      ansible.builtin.service:
        name: wg-quick@wg0
        state: restarted

    - name: restart systemd-resolved
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted
