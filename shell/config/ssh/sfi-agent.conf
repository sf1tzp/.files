# The agent persona's key for the forge (mac/modules/sfi-agent.nix in
# ~/.files). A Claude Code session on this Mac carries SFI_AGENT=1 in its
# environment (shell/config/claude-settings.json), and ssh matches on
# that: git pushes from a session reach forge.streetfortress.cloud as
# sfi-agent, with its own key and no other. Outside a session the
# variable is unset, this block does not match, and the forge sees the
# person's own key. Included from ~/.ssh/config, first line.
Match host forge.streetfortress.cloud exec "test \"$SFI_AGENT\" = 1"
  IdentityFile ~/.ssh/sfi-agent
  IdentitiesOnly yes
